name: Portable manifest evidence

on:
  pull_request:
    paths:
      - "crates/loom-core/src/format.rs"
      - "crates/loom-core/src/portable_manifest.rs"
      - "crates/loom-core/src/portable_tree.rs"
      - "crates/loom-core/src/repository.rs"
      - "crates/loom-core/src/store.rs"
      - "crates/loom-core/src/lib.rs"
      - "crates/loom-cli/src/main.rs"
      - "crates/loom-cli/tests/portable_manifest.rs"
      - "benchmarks/portable_manifest.py"
      - "benchmarks/portable_tree.py"
      - "benchmarks/portable_export.py"
      - "benchmarks/portable_verify.py"
      - "benchmarks/portable_migration_plan.py"
      - "docs/portable-v2-manifests.md"
      - ".github/workflows/portable-manifest.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: checked portable manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out exact baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Verify exact inputs
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C baseline rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build separate locked release binaries
        run: |
          CARGO_TARGET_DIR="${{ github.workspace }}/baseline-target" cargo build --release --locked -p loom-cli --manifest-path baseline/Cargo.toml
          CARGO_TARGET_DIR="${{ github.workspace }}/candidate-target" cargo build --release --locked -p loom-cli --manifest-path candidate/Cargo.toml
      - name: Run checked publication workflows
        working-directory: candidate
        run: |
          mkdir -p artifacts
          python3 benchmarks/portable_manifest.py \
            --loom "${{ github.workspace }}/candidate-target/release/loom" \
            --baseline-loom "${{ github.workspace }}/baseline-target/release/loom" \
            --bytes 1024 8388608 71303168 --repeat 7 --large-repeat 3 \
            --output artifacts/portable-manifest.json
          python3 benchmarks/portable_tree.py \
            --loom "${{ github.workspace }}/candidate-target/release/loom" \
            --baseline-loom "${{ github.workspace }}/baseline-target/release/loom" \
            --files 100 1000 --file-bytes 4096 --workers 1 2 4 0 --repeat 5 \
            --output artifacts/portable-tree.json
          python3 benchmarks/portable_export.py \
            --loom "${{ github.workspace }}/candidate-target/release/loom" \
            --baseline-loom "${{ github.workspace }}/baseline-target/release/loom" \
            --files 100 1000 --file-bytes 4096 --workers 1 2 4 0 --repeat 5 \
            --output artifacts/portable-export.json
          python3 benchmarks/portable_verify.py \
            --loom "${{ github.workspace }}/candidate-target/release/loom" \
            --baseline-loom "${{ github.workspace }}/baseline-target/release/loom" \
            --files 100 1000 --file-bytes 4096 --workers 1 2 4 0 --repeat 5 \
            --output artifacts/portable-verify.json
          python3 benchmarks/portable_migration_plan.py \
            --loom "${{ github.workspace }}/candidate-target/release/loom" \
            --baseline-loom "${{ github.workspace }}/baseline-target/release/loom" \
            --files 100 1000 --file-bytes 4096 --workers 1 2 4 0 --repeat 5 \
            --output artifacts/portable-migration-plan.json
      - name: Record exact provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          data = {
              "candidate_commit": output("git", "-C", "candidate", "rev-parse", "HEAD"),
              "baseline_commit": output("git", "-C", "baseline", "rev-parse", "HEAD"),
              "candidate_tree": output("git", "-C", "candidate", "rev-parse", "HEAD^{tree}"),
              "baseline_tree": output("git", "-C", "baseline", "rev-parse", "HEAD^{tree}"),
              "rustc": output("rustc", "--version"),
              "candidate_sha256": hashlib.sha256(Path("candidate-target/release/loom").read_bytes()).hexdigest(),
              "baseline_sha256": hashlib.sha256(Path("baseline-target/release/loom").read_bytes()).hexdigest(),
              "harness_sha256": hashlib.sha256(Path("candidate/benchmarks/portable_manifest.py").read_bytes()).hexdigest(),
              "tree_harness_sha256": hashlib.sha256(Path("candidate/benchmarks/portable_tree.py").read_bytes()).hexdigest(),
              "export_harness_sha256": hashlib.sha256(Path("candidate/benchmarks/portable_export.py").read_bytes()).hexdigest(),
              "verify_harness_sha256": hashlib.sha256(Path("candidate/benchmarks/portable_verify.py").read_bytes()).hexdigest(),
              "migration_plan_harness_sha256": hashlib.sha256(Path("candidate/benchmarks/portable_migration_plan.py").read_bytes()).hexdigest(),
          }
          Path("candidate/artifacts/provenance.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: portable-manifest-${{ github.event.pull_request.head.sha }}
          path: candidate/artifacts/
          if-no-files-found: error
          retention-days: 90
