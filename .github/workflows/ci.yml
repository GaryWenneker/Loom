name: Rust CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: loom-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - name: Verify equivalent Git comparison harness
        if: runner.os == 'Linux'
        run: |
          python3 -m py_compile benchmarks/compare_git.py
          python3 benchmarks/compare_git.py --loom target/debug/loom --batch --multi --read-pack --rounds 2 --layout nested --directories 4 --files 10 --repeat 1 --requests 10 --history 1 --output /tmp/git-compare-smoke.json
          python3 -m py_compile benchmarks/compare_native_group.py
          python3 benchmarks/compare_native_group.py --loom target/debug/loom --baseline-loom target/debug/loom --files 10 --repeat 2 --requests 10 --output /tmp/native-pairs-smoke.json
          python3 -m py_compile benchmarks/compare_publication.py
          python3 benchmarks/compare_publication.py --loom target/debug/loom --baseline-loom target/debug/loom --files 12 --repeat 1 --directories 4 --layout nested --output /tmp/publication-smoke.json
          python3 -m py_compile benchmarks/scan_workers.py
          python3 benchmarks/scan_workers.py --loom target/debug/loom --files 40 --workers 1 4 1024 --repeat 1 --directories 4 --output /tmp/scan-workers-smoke.json
          python3 -m py_compile benchmarks/pathsets.py
          for workers in 1 8; do
            python3 benchmarks/pathsets.py --loom target/debug/loom --baseline-loom target/debug/loom --files 16 --repeat 1 --directories 4 --scan-workers "$workers" --output "/tmp/pathsets-workers-$workers-smoke.json"
          done
  msrv:
    name: Rust 1.85 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --all-targets --locked
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file Cargo.lock
