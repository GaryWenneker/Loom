name: Loom scalability evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/pathsets.py'
      - 'crates/loom-core/**'
      - 'crates/loom-cli/**'
      - 'docs/pathset-staging.md'
      - '.github/workflows/scalability.yml'
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Loom CLI
        run: cargo build --release --locked -p loom-cli
      - name: Validate harness syntax
        run: python3 -m py_compile benchmarks/loom_bench.py benchmarks/compare_git.py
      - name: Run deterministic scaling samples
        run: |
          python3 benchmarks/loom_bench.py \
            --loom target/release/loom \
            --files 100 1000 10000 \
            --repeat 20 \
            --output loom-scale-results.json
      - name: Compare checked immutable queries with packed Git
        run: |
          python3 benchmarks/compare_git.py --loom target/release/loom --batch --multi --read-pack \
            --files 1000 10000 100000 --repeat 5 --requests 1000 \
            --output loom-git-compare.json
          python3 benchmarks/compare_git.py --loom target/release/loom --batch --multi --read-pack \
            --layout sharded --files 10000 --repeat 5 --requests 1000 \
            --output loom-git-sharded.json
      - name: Compare deeper directory hierarchies
        run: |
          python3 benchmarks/compare_git.py --loom target/release/loom --batch --multi --read-pack \
            --layout nested --directories 1024 --files 10000 --repeat 5 --requests 1000 \
            --output loom-git-nested.json
      - name: Compare repeated immutable working sets
        run: |
          python3 benchmarks/compare_git.py --loom target/release/loom --batch --multi \
            --layout nested --directories 1024 --files 10000 --rounds 100 --repeat 10 --requests 1000 \
            --output loom-working-set.json
      - name: Upload raw timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-scale-${{ github.sha }}
          path: |
            loom-scale-results.json
            loom-git-compare.json
            loom-git-sharded.json
            loom-git-nested.json
            loom-working-set.json
          if-no-files-found: warn
          retention-days: 90

  pathset-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate
      - name: Check out exact base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Build exact base and candidate
        run: |
          CARGO_TARGET_DIR="${{ github.workspace }}/baseline-target" cargo build --release --locked -p loom-cli --manifest-path baseline/Cargo.toml
          CARGO_TARGET_DIR="${{ github.workspace }}/candidate-target" cargo build --release --locked -p loom-cli --manifest-path candidate/Cargo.toml
      - name: Compare sequential selected-set flow with base and Git
        working-directory: candidate
        run: |
          python3 benchmarks/pathsets.py \
            --loom "${{ github.workspace }}/candidate-target/release/loom" \
            --baseline-loom "${{ github.workspace }}/baseline-target/release/loom" \
            --files 1000 10000 100000 --directories 256 --repeat 6 \
            --scan-workers 1 --output pathsets-workers-1.json
      - name: Compare bounded parallel selected-set flow with base and Git
        working-directory: candidate
        run: |
          python3 benchmarks/pathsets.py \
            --loom "${{ github.workspace }}/candidate-target/release/loom" \
            --baseline-loom "${{ github.workspace }}/baseline-target/release/loom" \
            --files 1000 10000 100000 --directories 256 --repeat 6 \
            --scan-workers 8 --output pathsets-workers-8.json
      - name: Upload checked raw pathset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loom-pathsets-${{ github.sha }}
          path: |
            candidate/pathsets-workers-1.json
            candidate/pathsets-workers-8.json
          if-no-files-found: error
          retention-days: 90
