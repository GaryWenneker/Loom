name: Bounded read-pack evidence

on:
  pull_request:
    paths:
      - "crates/loom-core/src/read_pack.rs"
      - "crates/loom-core/src/snapshot.rs"
      - "crates/loom-core/src/store.rs"
      - "benchmarks/compare_git.py"
      - "docs/snapshot-query-protocol.md"
      - "docs/storage-backends.md"
      - "docs/performance-read-pack-memory-20261020.md"
      - ".github/workflows/read-pack.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: bounded read-pack comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out exact baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Verify exact inputs
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git -C baseline rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build isolated binaries
        run: |
          CARGO_TARGET_DIR="${{ github.workspace }}/baseline-target" cargo build --release --locked -p loom-cli --manifest-path baseline/Cargo.toml
          CARGO_TARGET_DIR="${{ github.workspace }}/candidate-target" cargo build --release --locked -p loom-cli --manifest-path candidate/Cargo.toml
      - name: Run identical packed query workflows
        working-directory: candidate
        run: |
          mkdir -p artifacts
          python3 benchmarks/compare_git.py \
            --loom "${{ github.workspace }}/candidate-target/release/loom" \
            --baseline-loom "${{ github.workspace }}/baseline-target/release/loom" \
            --baseline-multi --batch --multi --read-pack --cache-bytes 0 \
            --layout nested --directories 64 --files 256 4096 \
            --repeat 5 --requests 64 \
            --output artifacts/read-pack.json
      - name: Record exact provenance
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          def output(*args):
              return subprocess.check_output(args, text=True).strip()
          data = {
              "candidate_commit": output("git", "-C", "candidate", "rev-parse", "HEAD"),
              "baseline_commit": output("git", "-C", "baseline", "rev-parse", "HEAD"),
              "candidate_tree": output("git", "-C", "candidate", "rev-parse", "HEAD^{tree}"),
              "baseline_tree": output("git", "-C", "baseline", "rev-parse", "HEAD^{tree}"),
              "rustc": output("rustc", "--version"),
              "candidate_sha256": hashlib.sha256(Path("candidate-target/release/loom").read_bytes()).hexdigest(),
              "baseline_sha256": hashlib.sha256(Path("baseline-target/release/loom").read_bytes()).hexdigest(),
              "harness_sha256": hashlib.sha256(Path("candidate/benchmarks/compare_git.py").read_bytes()).hexdigest(),
          }
          Path("candidate/artifacts/provenance.json").write_text(json.dumps(data, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-pack-${{ github.event.pull_request.head.sha }}
          path: candidate/artifacts/
          if-no-files-found: warn
          retention-days: 90
